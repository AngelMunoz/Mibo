name: Create Release

on:
  workflow_dispatch:

jobs:
  create-release:
    # Mibo.Core's package depends on Mibo.Adaptive (the nuspec pins the last
    # released adaptive version), so adaptive must reach NuGet first — a
    # consumer restoring Mibo.Core in the window before Mibo.Adaptive exists
    # would fail. The adaptive job skips quietly when its changelog has no
    # released version; this job then proceeds as before.
    needs: create-adaptive-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract Release Data
        id: extract
        run: |
          # Find the first version header (e.g. ## [1.0.0] - 2023-01-01)
          # We skip [Unreleased]
          VERSION_LINE=$(grep -n "^## \[[0-9]" CHANGELOG.md | head -n 1)

          if [ -z "$VERSION_LINE" ]; then
            echo "No version found in CHANGELOG.md"
            exit 1
          fi

          LINE_NUM=$(echo "$VERSION_LINE" | cut -d: -f1)
          VERSION=$(echo "$VERSION_LINE" | sed -E 's/.*## \[([^]]+)\].*/\1/')

          echo "Found version: $VERSION at line $LINE_NUM"

          # Find the next header (either [Unreleased], another version, or end of file) to determine end of current section
          # We start looking AFTER the found version line
          NEXT_HEADER_LINE=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md | grep -n "^## \[" | head -n 1 | cut -d: -f1)

          if [ -z "$NEXT_HEADER_LINE" ]; then
            # No next header, read until end
            BODY=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md)
          else
            # Calculate how many lines to read
            # NEXT_HEADER_LINE is relative to the tail output, so it's the number of lines to grab minus 1
            BODY=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md | head -n $((NEXT_HEADER_LINE - 1)))
          fi

          # Write body to file to avoid escaping issues
          echo "$BODY" > RELEASE_NOTES.md

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # A version is a prerelease if it contains an alpha/beta/rc tag
          # (e.g. 2.0.0-rc.1, 2.0.0-beta.2, 2.0.0-alpha.3)
          if echo "$VERSION" | grep -qiE '(alpha|beta|rc)'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.extract.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.extract.outputs.version }} already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet tools
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet tool restore

      - name: Restore dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet restore

      - name: Run Tests
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet test --configuration Release --no-restore

      - name: Build
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet build --configuration Release --no-restore

      # Mibo.Adaptive has its own changelog and versioning (it versions itself
      # through its ChangelogFile) and is released by the dedicated job below,
      # so it is excluded from the main pack — otherwise the main release
      # would ship the adaptive package with the repo version. Mibo.Templates
      # versions from the repo changelog like the libraries and ships here.
      - name: Pack
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          for p in src/Mibo.Core/Mibo.Core.fsproj src/Mibo.Raylib/Mibo.Raylib.fsproj src/Mibo.MonoGame/Mibo.MonoGame.fsproj src/Templates/Mibo.Templates.csproj; do
            dotnet pack --configuration Release --no-build --output nupkgs "$p"
          done

      - name: Publish to NuGet
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract.outputs.version }}
          name: v${{ steps.extract.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.extract.outputs.prerelease }}
          files: nupkgs/*.nupkg

  # Mibo.Adaptive versions independently of the rest of the repo: its package
  # version, tag (adaptive-vX.Y.Z) and release notes all come from
  # src/Mibo.Adaptive/CHANGELOG.md. The job skips quietly while that changelog
  # has no released version yet (i.e. only an [Unreleased] section).
  create-adaptive-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract Adaptive Release Data
        id: extract
        run: |
          ADAPTIVE_CHANGELOG=src/Mibo.Adaptive/CHANGELOG.md
          VERSION_LINE=$(grep -n "^## \[[0-9]" "$ADAPTIVE_CHANGELOG" | head -n 1)

          if [ -z "$VERSION_LINE" ]; then
            echo "No released version in $ADAPTIVE_CHANGELOG — skipping."
            echo "version=" >> $GITHUB_OUTPUT
            exit 0
          fi

          LINE_NUM=$(echo "$VERSION_LINE" | cut -d: -f1)
          VERSION=$(echo "$VERSION_LINE" | sed -E 's/.*## \[([^]]+)\].*/\1/')
          echo "Found adaptive version: $VERSION at line $LINE_NUM"

          NEXT_HEADER_LINE=$(tail -n +$((LINE_NUM + 1)) "$ADAPTIVE_CHANGELOG" | grep -n "^## \[" | head -n 1 | cut -d: -f1)

          if [ -z "$NEXT_HEADER_LINE" ]; then
            BODY=$(tail -n +$((LINE_NUM + 1)) "$ADAPTIVE_CHANGELOG")
          else
            BODY=$(tail -n +$((LINE_NUM + 1)) "$ADAPTIVE_CHANGELOG" | head -n $((NEXT_HEADER_LINE - 1)))
          fi

          echo "$BODY" > ADAPTIVE_RELEASE_NOTES.md
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if echo "$VERSION" | grep -qiE '(alpha|beta|rc)'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if Adaptive Tag Exists
        id: check_tag
        run: |
          if git rev-parse "adaptive-v${{ steps.extract.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag adaptive-v${{ steps.extract.outputs.version }} already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        if: steps.extract.outputs.version != '' && steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet tools
        if: steps.extract.outputs.version != '' && steps.check_tag.outputs.exists == 'false'
        run: dotnet tool restore

      - name: Restore dependencies
        if: steps.extract.outputs.version != '' && steps.check_tag.outputs.exists == 'false'
        run: dotnet restore

      - name: Build
        if: steps.extract.outputs.version != '' && steps.check_tag.outputs.exists == 'false'
        run: dotnet build --configuration Release --no-restore src/Mibo.Adaptive/Mibo.Adaptive.fsproj

      - name: Pack
        if: steps.extract.outputs.version != '' && steps.check_tag.outputs.exists == 'false'
        run: dotnet pack --configuration Release --no-build --output nupkgs src/Mibo.Adaptive/Mibo.Adaptive.fsproj

      - name: Publish to NuGet
        if: steps.extract.outputs.version != '' && steps.check_tag.outputs.exists == 'false'
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create Release
        if: steps.extract.outputs.version != '' && steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: adaptive-v${{ steps.extract.outputs.version }}
          name: adaptive-v${{ steps.extract.outputs.version }}
          body_path: ADAPTIVE_RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.extract.outputs.prerelease }}
          files: nupkgs/*.nupkg
